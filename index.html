<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Silverbullet OSINT Framework v2.0</title>
    <style>
        :root {
            --bg-color: #050204;
            --panel-color: #11050d;
            --text-color: #fce8f3;
            --accent-color: #ff007f;
            --accent-dim: rgba(255, 0, 127, 0.15);
            --danger-color: #00f0ff;
            --danger-dim: rgba(0, 240, 255, 0.15);
            --border-color: #330b20;
            --term-bg: #030102;
            --success-color: #00ff7f;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', Courier, monospace; }

        body {
            background-color: var(--bg-color); color: var(--text-color);
            display: flex; justify-content: center; align-items: flex-start;
            min-height: 100vh; padding: 20px 15px;
            background-image: linear-gradient(rgba(255, 0, 127, 0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 0, 127, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        .container {
            width: 100%; max-width: 1000px;
            background-color: rgba(17, 5, 13, 0.95);
            border: 1px solid rgba(255, 0, 127, 0.3); border-radius: 8px;
            padding: 25px; box-shadow: 0 0 35px rgba(255, 0, 127, 0.15); margin-bottom: 30px;
        }

        .header { text-align: center; margin-bottom: 20px; border-bottom: 1px dashed var(--border-color); padding-bottom: 15px; }
        .header h1 { color: var(--accent-color); font-size: 2.2rem; letter-spacing: 2px; text-transform: uppercase; text-shadow: 0 0 15px rgba(255, 0, 127, 0.6); margin-bottom: 5px; }
        .header h1 span { font-size: 0.5em; color: var(--danger-color); text-shadow: 0 0 10px rgba(0, 240, 255, 0.5); vertical-align: middle; border: 1px solid var(--danger-color); padding: 2px 6px; border-radius: 4px; }
        .header p { font-size: 0.85rem; color: #b07c96; margin-top: 5px; }

        /* Stats Dashboard */
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 20px; }
        .stat-box { background: var(--term-bg); border: 1px solid var(--border-color); border-radius: 6px; padding: 15px; text-align: center; position: relative; overflow: hidden; }
        .stat-box::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 2px; background: var(--accent-color); opacity: 0.5; }
        .stat-box.danger::before { background: var(--danger-color); }
        .stat-box h2 { font-size: 2rem; margin-bottom: 5px; color: var(--text-color); }
        .stat-box.danger h2 { color: var(--danger-color); text-shadow: 0 0 10px rgba(0,240,255,0.4); }
        .stat-box p { font-size: 0.75rem; color: #b07c96; text-transform: uppercase; letter-spacing: 1px; }

        .tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; }
        .tab-btn { flex: 1; background-color: #0a0307; border: 1px solid var(--border-color); color: #b07c96; padding: 12px; font-weight: bold; cursor: pointer; transition: all 0.2s; border-radius: 4px; }
        .tab-btn:hover { background-color: var(--accent-dim); color: var(--accent-color); }
        .tab-btn.active { background-color: var(--accent-dim); border-color: var(--accent-color); color: var(--accent-color); box-shadow: inset 0 0 10px rgba(255,0,127,0.2); }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .controls, .controls-recon { display: grid; gap: 15px; margin-bottom: 20px; }
        .controls { grid-template-columns: 1.5fr 1fr 1fr 1fr; }
        .controls-recon { grid-template-columns: 2fr 1fr 1fr; }
        
        label { font-size: 0.8rem; display: block; margin-bottom: 8px; color: #b07c96; text-transform: uppercase; letter-spacing: 1px; }
        input, select, button, textarea { width: 100%; background-color: #080306; border: 1px solid var(--border-color); color: var(--text-color); padding: 12px; border-radius: 4px; font-size: 0.9rem; outline: none; transition: all 0.2s ease; }
        input:focus, select:focus, textarea:focus { border-color: var(--accent-color); box-shadow: 0 0 8px rgba(255, 0, 127, 0.2); }
        input, textarea { color: var(--accent-color); }

        .btn-primary { background-color: var(--accent-dim); border-color: var(--accent-color); color: var(--accent-color); font-weight: bold; cursor: pointer; }
        .btn-primary:hover:not(:disabled) { background-color: var(--accent-color); color: #000; box-shadow: 0 0 20px var(--accent-color); }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

        .btn-danger { background-color: transparent; border-color: var(--danger-color); color: var(--danger-color); font-weight: bold; cursor: pointer; }
        .btn-danger:hover:not(:disabled) { background-color: var(--danger-dim); box-shadow: 0 0 20px rgba(0, 240, 255, 0.4); }

        .btn-warning { background-color: transparent; border-color: #ffaa00; color: #ffaa00; font-weight: bold; cursor: pointer; }
        .btn-warning:hover:not(:disabled) { background-color: rgba(255, 170, 0, 0.15); box-shadow: 0 0 20px rgba(255, 170, 0, 0.4); }

        .custom-section { background-color: #0a0307; border: 1px dashed var(--accent-color); padding: 15px; border-radius: 4px; margin-bottom: 20px; display: none; }
        .custom-section textarea { height: 100px; resize: vertical; margin-bottom: 10px; font-size: 0.8rem; color: #e2b6c9; }
        
        .toggle-custom-btn { background: transparent; border: 1px dashed var(--border-color); color: #b07c96; padding: 8px; font-size: 0.75rem; cursor: pointer; margin-bottom: 15px; transition: all 0.2s; }
        .toggle-custom-btn:hover { border-color: var(--accent-color); color: var(--accent-color); }

        .results-container { border: 1px solid var(--border-color); background-color: #080306; border-radius: 4px; max-height: 350px; overflow-y: auto; margin-top: 15px; margin-bottom: 15px; display: none; }
        .dork-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 15px; border-bottom: 1px solid var(--border-color); gap: 15px; }
        .dork-info { flex-grow: 1; }
        .dork-meta { font-size: 0.75rem; color: var(--accent-color); margin-bottom: 4px; text-transform: uppercase; }
        .dork-query { font-size: 0.85rem; color: #e2b6c9; word-break: break-all; }

        table { width: 100%; border-collapse: collapse; }
        th { position: sticky; top: 0; background-color: #11050d; color: var(--accent-color); text-align: left; padding: 12px; border-bottom: 1px solid var(--accent-color); font-size: 0.8rem; letter-spacing: 1px; z-index: 10; }
        td { padding: 10px 12px; border-bottom: 1px solid var(--border-color); font-size: 0.85rem; color: #e2b6c9; vertical-align: middle; }
        tr:hover td { background-color: rgba(255,0,127,0.05); }
        
        .ip-col { color: var(--danger-color); }
        .geo-col { color: #b07c96; font-size: 0.75rem; }
        .intel-tag { display: inline-block; padding: 2px 6px; border-radius: 3px; font-size: 0.7rem; margin-right: 5px; border: 1px solid; }
        .intel-ports { color: #ffaa00; border-color: #ffaa00; background: rgba(255,170,0,0.1); }
        .intel-vuln { color: var(--danger-color); border-color: var(--danger-color); background: rgba(0,240,255,0.1); }

        .action-btn { background-color: #170712; color: var(--text-color); border: 1px solid var(--border-color); padding: 8px 12px; font-size: 0.75rem; cursor: pointer; border-radius: 4px; white-space: nowrap; transition: all 0.2s ease; text-decoration: none; text-align: center; }
        .action-btn:hover:not(:disabled) { border-color: var(--accent-color); color: var(--accent-color); background-color: rgba(255, 0, 127, 0.1); }

        .bulk-actions { display: flex; flex-direction: column; gap: 10px; background-color: #0a0307; padding: 15px; border: 1px solid var(--border-color); border-radius: 4px; display: none; }
        .action-btn-group { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }

        .terminal { background-color: var(--term-bg); border: 1px solid var(--border-color); border-radius: 4px; padding: 10px; font-size: 0.8rem; height: 180px; overflow-y: auto; color: #b07c96; display: flex; flex-direction: column; box-shadow: inset 0 0 10px rgba(0,0,0,0.8); margin-top: 10px; }
        .terminal-line { margin-bottom: 2px; line-height: 1.3; }
        .terminal span { color: var(--accent-color); }
        .terminal .cyan { color: var(--danger-color); }
        .terminal .warn { color: #ffaa00; }
        .terminal .success { color: var(--success-color); }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #050204; }
        ::-webkit-scrollbar-thumb { background: #330b20; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #ff007f; }

        @media (max-width: 768px) { .controls, .controls-recon { grid-template-columns: 1fr; } .stats-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Silverbullet OSINT <span>v2.0</span></h1>
        <p>Master Intelligence Framework // Deep Passive Reconnaissance</p>
        <p style="margin-top: 10px; font-size: 0.8rem; color: #b07c96;">
            Telegram: <a href="https://t.me/Silverbullets_bot" style="color: var(--danger-color); text-decoration: none;">@Silverbullets_bot</a>
        </p>
    </div>

    <!-- Analytics Dashboard -->
    <div class="stats-grid">
        <div class="stat-box">
            <h2 id="stat-assets">0</h2>
            <p>Mapped Assets</p>
        </div>
        <div class="stat-box danger">
            <h2 id="stat-ports">0</h2>
            <p>Open Ports</p>
        </div>
        <div class="stat-box danger">
            <h2 id="stat-cves">0</h2>
            <p>CVEs Detected</p>
        </div>
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('dork')" id="tab-dork">1. DORK ENGINE</button>
        <button class="tab-btn" onclick="switchTab('recon')" id="tab-recon">2. INFRASTRUCTURE & INTEL</button>
    </div>

    <!-- TAB 1: DORK ENGINE -->
    <div id="content-dork" class="tab-content active">
        <button class="toggle-custom-btn" onclick="toggleCustom()">[+] INJECT CUSTOM PAYLOADS (LOCAL DB)</button>
        <div class="custom-section" id="customPanel">
            <label>Load Dork Library:</label>
            <select id="dorkLibrary" onchange="loadLibrary()" style="margin-bottom: 10px;">
                <option value="">-- Select Category --</option>
                <option value="auth">Admin & Auth Panels</option>
                <option value="files">Sensitive Config/Files</option>
                <option value="backup">Database & Backups</option>
            </select>
            <label>Enter Custom Dorks (One per line). Use {target} as placeholder.</label>
            <textarea id="customDorks" placeholder="site:{target} ext:env&#10;inurl:admin {target}"></textarea>
            <button class="action-btn" onclick="saveCustomDorks()" style="border-color: var(--danger-color); color: var(--danger-color);">SAVE TO MEMORY</button>
        </div>

        <div class="controls">
            <div>
                <label>Target Domain</label>
                <input type="text" id="targetInput" placeholder="target.com">
            </div>
            <div>
                <label>Intel Platform</label>
                <select id="engineSelect">
                    <option value="google">Google</option>
                    <option value="duckduckgo">DuckDuckGo</option>
                    <option value="bing">Bing</option>
                    <option value="yandex">Yandex</option>
                    <option value="github">GitHub (Code)</option>
                    <option value="shodan">Shodan (Ports)</option>
                </select>
            </div>
            <div>
                <label>Filter Matrix</label>
                <select id="categorySelect">
                    <option value="all">ALL PAYLOADS</option>
                    <option value="custom">MY CUSTOM INJECTS</option>
                    <option value="config">CONFIG & ENV</option>
                    <option value="database">SQL & BACKUPS</option>
                    <option value="logs">LOG FILES</option>
                    <option value="admin">ADMIN PANELS</option>
                </select>
            </div>
            <div style="display: flex; align-items: flex-end;">
                <button class="btn-primary" onclick="generateMatrix()">BUILD MATRIX</button>
            </div>
        </div>

        <div class="bulk-actions" id="bulkPanel">
            <div class="action-btn-group">
                <button class="action-btn" onclick="copyMatrix()">[ COPY ] RAW TXT</button>
                <button class="action-btn" onclick="exportCSV()">[ EXPORT ] .CSV</button>
                <button class="action-btn" style="background-color: var(--accent-dim); color: var(--accent-color); border-color: var(--accent-color);" id="runQueueBtn" onclick="executeQueue()">▶ AUTO-RUN QUEUE</button>
            </div>
        </div>
        <div class="results-container" id="resultsBox"></div>
    </div>

    <!-- TAB 2: PASSIVE RECON & INTEL -->
    <div id="content-recon" class="tab-content">
        <div class="controls-recon">
            <div>
                <label>Target Domain (Passive Scan)</label>
                <input type="text" id="reconTarget" placeholder="e.g., tesla.com">
            </div>
            <div style="display: flex; align-items: flex-end;">
                <button class="btn-primary" id="reconBtn" onclick="runRecon()">1. MAP INFRASTRUCTURE</button>
            </div>
            <div style="display: flex; align-items: flex-end;">
                <button class="btn-danger" id="dnsBtn" onclick="runDNS()">2. DNS DUMP (TXT/MX)</button>
            </div>
        </div>

        <div class="bulk-actions" id="reconBulkPanel">
            <div class="action-btn-group">
                <button class="action-btn btn-warning" id="deepIntelBtn" onclick="runAutomatedDeepIntel()">▶ 3. RUN DEEP INTEL (SHODAN/CVE)</button>
                <button class="action-btn" onclick="exportMasterReport()">[ EXPORT ] MASTER JSON REPORT</button>
            </div>
        </div>
        
        <div class="results-container" id="reconResultsBox">
            <table id="reconTable">
                <thead><tr><th>SUBDOMAIN</th><th>IP & GEO-LOCATION</th><th>DEEP INTEL STATUS</th></tr></thead>
                <tbody id="reconTableBody"></tbody>
            </table>
        </div>
    </div>

    <!-- TERMINAL OUT -->
    <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 25px; margin-bottom: -5px;">
        <label style="color: #b07c96; font-size: 0.8rem; text-transform: uppercase; margin: 0;">[+] TERMINAL OUTPUT LOG</label>
        <button class="toggle-custom-btn" style="margin: 0; padding: 4px 8px; border-color: #330b20;" onclick="clearTerminal()">[ CLEAR BUFFER ]</button>
    </div>
    <div class="terminal" id="terminalLog"></div>
</div>

<script>
    // --- GLOBAL STATE ---
    let reconData = []; // Holds complex objects: { sub, ip, geo, ports: [], cves: [], checked: false }
    let globalStats = { assets: 0, ports: 0, cves: 0 };
    let dnsDataDump = [];

    // --- DORK LIBRARY ---
    const dorkLibrary = {
        auth: ["inurl:login {target}", "inurl:admin {target}", "intitle:dashboard {target}", "inurl:setup {target}"],
        files: ["site:{target} ext:env", "site:{target} ext:json", "site:{target} ext:log", "site:{target} ext:yaml", "site:{target} ext:git"],
        backup: ["site:{target} ext:sql", "site:{target} ext:bak", "site:{target} ext:zip", "site:{target} ext:tar.gz"]
    };

    const defaultTemplates = [
        { category: 'config', title: 'Exposed Configurations', query: 'site:{target} ext:env OR ext:yaml OR ext:ini OR ext:conf' },
        { category: 'database', title: 'Database Backups', query: 'site:{target} ext:sql OR ext:dbf OR ext:mdb OR ext:bak' },
        { category: 'database', title: 'SQL Error Leaks', query: 'site:{target} "SQL syntax error" OR "mysql_fetch_array()"' },
        { category: 'logs', title: 'System Logs', query: 'site:{target} ext:log OR ext:txt "error" OR "password"' },
        { category: 'admin', title: 'Admin Panels', query: 'site:{target} inurl:admin OR inurl:login OR inurl:dashboard' }
    ];

    let customTemplates = [];
    let currentMatrixData = []; 
    let currentActiveLinks = [];

    window.onload = () => {
        logTermText("[*] Silverbullet OSINT v2.0 Initialized.", "success");
        logTermText("[*] Geo-Spatial & CVE Subsystems online.");
        const saved = localStorage.getItem('sb_custom_dorks');
        if (saved) {
            document.getElementById('customDorks').value = saved;
            parseCustomDorks(saved);
        }
    };

    function updateStats() {
        document.getElementById('stat-assets').innerText = globalStats.assets;
        document.getElementById('stat-ports').innerText = globalStats.ports;
        document.getElementById('stat-cves').innerText = globalStats.cves;
    }

    // --- SECURE TERMINAL LOGGING ---
    function createTerminalLine() {
        const div = document.createElement('div');
        div.className = 'terminal-line';
        const time = new Date().toLocaleTimeString('en-US', { hour12: false });
        div.appendChild(document.createTextNode(`[${time}] `));
        return div;
    }

    function appendTerminalLine(element) {
        const term = document.getElementById('terminalLog');
        term.appendChild(element);
        term.scrollTop = term.scrollHeight;
    }

    // Helper to log text with optional color class applied to the whole message
    function logTermText(msg, colorClass = null) {
        const line = createTerminalLine();
        if (colorClass) {
            const span = document.createElement('span');
            span.className = colorClass;
            span.textContent = msg;
            line.appendChild(span);
        } else {
            line.appendChild(document.createTextNode(msg));
        }
        appendTerminalLine(line);
    }

    function clearTerminal() {
        const term = document.getElementById('terminalLog');
        term.innerHTML = '';
        logTermText("[*] Terminal buffer flushed.");
    }

    // --- UI TABS ---
    function switchTab(tabId) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
        document.getElementById(`tab-${tabId}`).classList.add('active');
        document.getElementById(`content-${tabId}`).classList.add('active');
        
        const line = createTerminalLine();
        line.appendChild(document.createTextNode("Switched to "));
        const span = document.createElement('span');
        span.className = "cyan";
        span.textContent = `[ ${tabId.toUpperCase()} MODULE ]`;
        line.appendChild(span);
        appendTerminalLine(line);
    }

    // --- DORK ENGINE LOGIC ---
    function loadLibrary() {
        const cat = document.getElementById('dorkLibrary').value;
        if(cat && dorkLibrary[cat]) {
            document.getElementById('customDorks').value = dorkLibrary[cat].join('\n');
            logTermText(`Loaded ${cat} template library.`);
        }
    }

    function toggleCustom() {
        const panel = document.getElementById('customPanel');
        panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
    }

    function saveCustomDorks() {
        const raw = document.getElementById('customDorks').value;
        localStorage.setItem('sb_custom_dorks', raw);
        parseCustomDorks(raw);
        
        const line = createTerminalLine();
        line.appendChild(document.createTextNode("Custom DB updated: "));
        const span = document.createElement('span');
        span.className = "cyan";
        span.textContent = customTemplates.length;
        line.appendChild(span);
        line.appendChild(document.createTextNode(" payloads loaded."));
        appendTerminalLine(line);
        toggleCustom();
    }

    function parseCustomDorks(rawText) {
        customTemplates = rawText.split('\n').map(l => l.trim()).filter(l => l.length > 0).map(q => ({ category: 'custom', title: 'Custom Inject', query: q }));
    }

    function generateMatrix() {
        const target = document.getElementById('targetInput').value.trim();
        const category = document.getElementById('categorySelect').value;
        const engine = document.getElementById('engineSelect').value;
        const resultsBox = document.getElementById('resultsBox');
        
        if (!target) return logTermText("[ERROR] Target Domain required.", "cyan");
        
        let cleanTarget = target.replace(/^(https?:\/\/)?(www\.)?/, '').split('/')[0];
        resultsBox.innerHTML = ''; currentActiveLinks = []; currentMatrixData = [];
        let allTemplates = [...defaultTemplates, ...customTemplates];
        let filtered = category === 'all' ? allTemplates : allTemplates.filter(d => d.category === category);

        logTermText(`Building matrix for ${cleanTarget}...`);

        filtered.forEach(item => {
            const query = item.query.replace(/{target}/g, cleanTarget);
            let searchUrl = ""; const encQ = encodeURIComponent(query);
            
            if (engine === 'google') searchUrl = `https://www.google.com/search?q=${encQ}`;
            else if (engine === 'duckduckgo') searchUrl = `https://duckduckgo.com/?q=${encQ}`;
            else if (engine === 'bing') searchUrl = `https://www.bing.com/search?q=${encQ}`;
            else if (engine === 'github') searchUrl = `https://github.com/search?type=code&q=${encQ}`;
            else if (engine === 'shodan') searchUrl = `https://www.shodan.io/search?query=${encQ}`;
            else searchUrl = `https://yandex.com/search/?text=${encQ}`;
            
            currentActiveLinks.push(searchUrl);
            currentMatrixData.push({ Category: item.category.toUpperCase(), Query: query, URL: searchUrl });

            const div = document.createElement('div');
            div.className = 'dork-item';
            
            const info = document.createElement('div');
            info.className = 'dork-info';
            
            const meta = document.createElement('div');
            meta.className = 'dork-meta';
            meta.textContent = `[${item.category}] - ${item.title}`;
            
            const qDiv = document.createElement('div');
            qDiv.className = 'dork-query';
            qDiv.textContent = query;
            
            info.appendChild(meta);
            info.appendChild(qDiv);
            
            const launchBtn = document.createElement('a');
            launchBtn.className = 'action-btn';
            launchBtn.href = searchUrl;
            launchBtn.target = '_blank';
            launchBtn.textContent = 'LAUNCH';
            
            div.appendChild(info);
            div.appendChild(launchBtn);
            resultsBox.appendChild(div);
        });

        resultsBox.style.display = 'block'; 
        document.getElementById('bulkPanel').style.display = 'flex';
        logTermText(`Matrix built: ${filtered.length} vectors ready.`, "success");
    }

    function copyMatrix() {
        if (!currentMatrixData.length) return;
        navigator.clipboard.writeText(currentMatrixData.map(d => d.Query).join('\n'));
        logTermText(`Copied payloads to clipboard.`);
    }

    function exportCSV() {
        if (!currentMatrixData.length) return;
        const csv = "Category,Query,URL\n" + currentMatrixData.map(d => `"${d.Category}","${d.Query.replace(/"/g, '""')}","${d.URL}"`).join("\n");
        downloadFile(csv, 'SB_Dorks.csv', 'text/csv');
        logTermText(`Exfiltrated matrix to .CSV`, "cyan");
    }

    const delay = ms => new Promise(res => setTimeout(res, ms));

    async function executeQueue() {
        if (currentActiveLinks.length === 0) return;
        const btn = document.getElementById('runQueueBtn');
        btn.disabled = true; btn.style.opacity = "0.5";
        
        logTermText("[!] Auto-Execution requires Popup Permissions enabled in browser.", "warn");

        for (let idx = 0; idx < currentActiveLinks.length; idx++) {
            window.open(currentActiveLinks[idx], '_blank');
            if (idx < currentActiveLinks.length - 1) {
                const sleepTime = Math.floor(Math.random() * 4000) + 4000;
                logTermText(`Payload ${idx + 1}/${currentActiveLinks.length} executed. Sleeping ${(sleepTime / 1000).toFixed(1)}s...`);
                await delay(sleepTime);
            }
        }
        logTermText("Queue execution complete.", "success"); 
        btn.disabled = false; btn.style.opacity = "1";
    }

    // --- v2.0 INFRASTRUCTURE & INTEL LOGIC ---
    
    async function fetchGeoIP(ip) {
        try {
            // GeoJS is CORS friendly and free without keys
            const res = await fetch(`https://get.geojs.io/v1/ip/geo/${ip}.json`);
            if(!res.ok) return "Geo: Unknown";
            const data = await res.json();
            return `${data.country} | ${data.organization || 'Unknown ISP'}`;
        } catch (e) {
            return "Geo: Lookup Failed";
        }
    }

    async function runRecon() {
        const target = document.getElementById('reconTarget').value.trim();
        const btn = document.getElementById('reconBtn');
        const resBox = document.getElementById('reconResultsBox');
        const tbody = document.getElementById('reconTableBody');
        
        if (!target) return logTermText("[ERROR] Target Domain required.", "cyan");
        let cleanTarget = target.replace(/^(https?:\/\/)?(www\.)?/, '').split('/')[0];

        btn.disabled = true; btn.innerText = "SCANNING...";
        logTermText(`Initiating passive mapping on ${cleanTarget}...`);
        
        // Reset state
        tbody.innerHTML = ''; 
        reconData = [];
        globalStats.assets = 0; globalStats.ports = 0; globalStats.cves = 0;
        updateStats();

        const targetApi = `https://api.hackertarget.com/hostsearch/?q=${cleanTarget}`;
        const routingNodes = [
            `https://corsproxy.io/?${encodeURIComponent(targetApi)}`,
            `https://api.allorigins.win/raw?url=${encodeURIComponent(targetApi)}`,
            `https://api.codetabs.com/v1/proxy/?quest=${encodeURIComponent(targetApi)}`
        ];

        let success = false;
        let rawLines = [];

        for (let i = 0; i < routingNodes.length; i++) {
            logTermText(`Connecting to Routing Node 0${i+1}...`);
            try {
                const response = await fetch(routingNodes[i]);
                if (!response.ok) throw new Error("Node communication error.");
                const text = await response.text();
                if (text.includes('error') || text.trim() === '' || text.includes('<html>')) {
                    throw new Error("Invalid or rate-limited response block.");
                }
                rawLines = text.trim().split('\n');
                success = true;
                break;
            } catch (error) {
                logTermText(`[!] Node 0${i+1} blocked. Rerouting...`, "warn");
            }
        }

        if (!success) {
            btn.disabled = false; btn.innerText = "1. MAP INFRASTRUCTURE";
            return logTermText("[!] CRITICAL: All proxies rate-limited. Try again in 5 minutes.", "cyan");
        }

        logTermText(`[+] Subdomains extracted. Resolving Geo-Spatial data...`);
        
        // Process data and populate UI
        for (let i = 0; i < rawLines.length; i++) {
            const parts = rawLines[i].split(',');
            if (parts.length === 2) {
                const sub = parts[0];
                const ip = parts[1];
                
                // Fetch Geo IP Passively
                const geo = await fetchGeoIP(ip);
                
                // Store in v2 data structure
                const dataObj = { sub, ip, geo, ports: [], cves: [], checked: false, rowId: `row-${i}` };
                reconData.push(dataObj);
                globalStats.assets++;

                // Build Table Row
                const tr = document.createElement('tr');
                tr.id = dataObj.rowId;
                
                const tdSub = document.createElement('td');
                tdSub.textContent = sub;
                
                const tdIpGeo = document.createElement('td');
                const ipSpan = document.createElement('div');
                ipSpan.className = 'ip-col';
                ipSpan.textContent = ip;
                const geoSpan = document.createElement('div');
                geoSpan.className = 'geo-col';
                geoSpan.textContent = geo;
                tdIpGeo.appendChild(ipSpan);
                tdIpGeo.appendChild(geoSpan);
                
                const tdIntel = document.createElement('td');
                tdIntel.id = `intel-${i}`;
                tdIntel.textContent = "Awaiting Scan...";
                tdIntel.style.color = "#555";
                
                tr.appendChild(tdSub);
                tr.appendChild(tdIpGeo);
                tr.appendChild(tdIntel);
                tbody.appendChild(tr);
            }
        }

        updateStats();
        resBox.style.display = 'block';
        document.getElementById('reconBulkPanel').style.display = 'flex';
        
        logTermText(`Mapping Complete: ${reconData.length} unique assets found.`, "success");
        btn.disabled = false; btn.innerText = "1. MAP INFRASTRUCTURE";
    }

    async function runAutomatedDeepIntel() {
        if(reconData.length === 0) return logTermText("[!] No mapped assets to scan.", "warn");
        
        const btn = document.getElementById('deepIntelBtn');
        btn.disabled = true; btn.innerText = "SCANNING INTERNETDB...";

        logTermText(`Initiating automated Deep Intel scan on ${reconData.length} targets...`);

        // We use a Set to avoid querying the same IP multiple times if it shares subdomains
        const processedIps = new Map();

        for (let i = 0; i < reconData.length; i++) {
            const node = reconData[i];
            const tdIntel = document.getElementById(`intel-${i}`);
            
            if (processedIps.has(node.ip)) {
                // Already scanned this IP, copy results
                const cached = processedIps.get(node.ip);
                node.ports = cached.ports; node.cves = cached.cves; node.checked = true;
                updateIntelCell(tdIntel, node.ports, node.cves);
                continue;
            }

            tdIntel.textContent = "Querying Shodan...";
            tdIntel.style.color = "#ffaa00";
            
            try {
                const response = await fetch(`https://internetdb.shodan.io/${node.ip}`);
                if (response.status === 404) {
                    node.checked = true;
                    processedIps.set(node.ip, {ports: [], cves: []});
                    tdIntel.textContent = "No Data Found";
                    tdIntel.style.color = "#555";
                    await delay(300); // polite delay
                    continue;
                }
                if (!response.ok) throw new Error("API Error");
                
                const data = await response.json();
                node.ports = data.ports || [];
                node.cves = data.vulns || [];
                node.checked = true;
                
                processedIps.set(node.ip, {ports: node.ports, cves: node.cves});
                
                globalStats.ports += node.ports.length;
                globalStats.cves += node.cves.length;
                
                updateIntelCell(tdIntel, node.ports, node.cves);
                updateStats();
                
                // Print high severity findings to terminal
                if(node.cves.length > 0) {
                    logTermText(`[CRITICAL] ${node.ip} has ${node.cves.length} exposed vulnerabilities!`, "cyan");
                }

                await delay(1000); // 1 sec delay to respect Shodan limits
                
            } catch (error) {
                tdIntel.textContent = "Scan Failed";
                tdIntel.style.color = "var(--danger-color)";
            }
        }
        
        logTermText("Deep Intel scan complete.", "success");
        btn.disabled = false; btn.innerText = "▶ 3. RUN DEEP INTEL (SHODAN/CVE)";
    }

    function updateIntelCell(cell, ports, cves) {
        cell.innerHTML = '';
        if(ports.length === 0 && cves.length === 0) {
            cell.textContent = "Clean / No Exposure";
            cell.style.color = "var(--success-color)";
            return;
        }
        
        if(ports.length > 0) {
            const p = document.createElement('span');
            p.className = 'intel-tag intel-ports';
            p.textContent = `${ports.length} PORTS`;
            cell.appendChild(p);
        }
        
        if(cves.length > 0) {
            const c = document.createElement('span');
            c.className = 'intel-tag intel-vuln';
            c.textContent = `${cves.length} CVES`;
            cell.appendChild(c);
        }
    }

    async function runDNS() {
        const target = document.getElementById('reconTarget').value.trim();
        if (!target) return logTermText("[ERROR] Target Domain required for DNS dump.", "cyan");
        let cleanTarget = target.replace(/^(https?:\/\/)?(www\.)?/, '').split('/')[0];

        logTermText(`Initiating DNS-over-HTTPS lookup for ${cleanTarget}...`);
        dnsDataDump = []; // clear previous
        
        const recordTypes = [{ type: 16, name: 'TXT' }, { type: 15, name: 'MX' }];
        
        for (const record of recordTypes) {
            try {
                const response = await fetch(`https://dns.google/resolve?name=${cleanTarget}&type=${record.type}`);
                const data = await response.json();
                
                if (data.Answer && data.Answer.length > 0) {
                    logTermText(`[+] ${record.name} Records Found:`, "success");
                    data.Answer.forEach(ans => {
                        dnsDataDump.push({ type: record.name, data: ans.data });
                        logTermText(`    -> ${ans.data}`, "cyan");
                    });
                } else {
                    logTermText(`[-] No ${record.name} records found.`);
                }
            } catch (error) {
                logTermText(`[!] DNS lookup failed for ${record.name}.`, "warn");
            }
        }
    }

    function exportMasterReport() {
        if (reconData.length === 0) return logTermText("[!] No mapped assets to export.", "warn");
        
        const report = {
            metadata: {
                generator: "Silverbullet OSINT Framework v2.0",
                timestamp: new Date().toISOString(),
                total_assets: globalStats.assets,
                total_open_ports: globalStats.ports,
                total_cves: globalStats.cves
            },
            dns_records: dnsDataDump,
            infrastructure: reconData.map(d => ({
                subdomain: d.sub,
                ip_address: d.ip,
                geo_isp: d.geo,
                intel_checked: d.checked,
                open_ports: d.ports,
                known_cves: d.cves
            }))
        };

        const jsonString = JSON.stringify(report, null, 4);
        downloadFile(jsonString, 'SB_Master_Intel_Report.json', 'application/json');
        logTermText(`Exfiltrated Master Intel Report to .JSON`, "success");
    }

    function downloadFile(content, name, type) {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([content], { type }));
        a.download = name; a.click();
    }
</script>
